<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">WebMCP と ADK multi-agent で席を予約する完成イメージ</title>
  <desc id="desc">予約サイト、WebMCP、coordinator Workflow、preference parser、seat finder、seat ranker、reservation agent、運営予約ボードが接続されている図</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#202124"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34A853"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f8f9fa"/>
  <rect x="55" y="55" width="1090" height="565" rx="32" fill="#eef0f2"/>
  <text x="95" y="118" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#202124">WebMCP x ADK seat reservation workflow</text>

  <rect x="95" y="165" width="260" height="350" rx="22" fill="#fff"/>
  <text x="125" y="215" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#202124">Reservation site</text>
  <text x="125" y="250" font-family="Arial, sans-serif" font-size="17" fill="#5f6368">HTML / CSS / JS</text>
  <g transform="translate(126 285)">
    <rect width="46" height="46" rx="8" fill="#34A853"/>
    <rect x="58" width="46" height="46" rx="8" fill="#34A853"/>
    <rect x="116" width="46" height="46" rx="8" fill="#EA4335"/>
    <rect x="174" width="46" height="46" rx="8" fill="#34A853"/>
    <rect y="58" width="46" height="46" rx="8" fill="#FBBC04"/>
    <rect x="58" y="58" width="46" height="46" rx="8" fill="#34A853"/>
    <rect x="116" y="58" width="46" height="46" rx="8" fill="#34A853"/>
    <rect x="174" y="58" width="46" height="46" rx="8" fill="#EA4335"/>
  </g>
  <rect x="125" y="425" width="195" height="42" rx="8" fill="#E8F0FE"/>
  <text x="143" y="452" font-family="Arial, sans-serif" font-size="17" fill="#1967D2">WebMCP exposed</text>

  <rect x="430" y="165" width="260" height="350" rx="22" fill="#4285F4"/>
  <text x="460" y="215" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">WebMCP</text>
  <rect x="460" y="255" width="200" height="62" rx="12" fill="#E8F0FE"/>
  <text x="480" y="294" font-family="Arial, sans-serif" font-size="18" fill="#174EA6">Imperative tools</text>
  <rect x="460" y="340" width="200" height="62" rx="12" fill="#FEF7E0"/>
  <text x="480" y="379" font-family="Arial, sans-serif" font-size="18" fill="#A14200">Declarative action</text>
  <text x="460" y="460" font-family="Arial, sans-serif" font-size="17" fill="#E8F0FE">browser model context</text>

  <rect x="765" y="130" width="310" height="430" rx="22" fill="#fff"/>
  <text x="795" y="177" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#202124">Coordinator Workflow</text>
  <rect x="795" y="210" width="235" height="45" rx="10" fill="#E8F0FE"/>
  <text x="815" y="239" font-family="Arial, sans-serif" font-size="16" fill="#174EA6">parse preference</text>
  <rect x="795" y="275" width="235" height="45" rx="10" fill="#E6F4EA"/>
  <text x="815" y="304" font-family="Arial, sans-serif" font-size="16" fill="#137333">find candidates</text>
  <rect x="795" y="340" width="235" height="45" rx="10" fill="#FEF7E0"/>
  <text x="815" y="369" font-family="Arial, sans-serif" font-size="16" fill="#A14200">rank seats</text>
  <rect x="795" y="405" width="235" height="45" rx="10" fill="#FCE8E6"/>
  <text x="815" y="434" font-family="Arial, sans-serif" font-size="16" fill="#A50E0E">reserve once</text>
  <text x="795" y="505" font-family="Arial, sans-serif" font-size="16" fill="#5f6368">retry only on seat_already_reserved</text>

  <path d="M365 340 H415" stroke="#202124" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M700 340 H750" stroke="#202124" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M920 568 C920 600 250 600 225 525" fill="none" stroke="#34A853" stroke-width="5" stroke-dasharray="10 9" marker-end="url(#green-arrow)"/>
  <text x="330" y="624" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#202124">BOARD_URL に connpass ID が表示されたら完成</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">座席予約 Agent の境界</title>
  <desc id="desc">自然文入力から preference parser、seat finder、Python ranking、reservation agent、運営ボードへ流れる座席予約 workflow。</desc>
  <defs>
    <style>
      .bg{fill:#fbfcfe}
      .box{fill:#fff;stroke:#d8dee9;stroke-width:2}
      .code{fill:#f2f4f7;stroke:#d0d5dd;stroke-width:2}
      .web{fill:#edf4ff;stroke:#9cc3ff;stroke-width:2}
      .title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .label{font:700 21px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .body{font:500 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#344054}
      .arrow{stroke:#667085;stroke-width:3.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#667085"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <text class="title" x="56" y="64">自然文は Agent、決定はコード、外部操作は Tool</text>
  <rect class="box" x="56" y="124" width="210" height="120" rx="16"/>
  <text class="label" x="82" y="170">ユーザー入力</text>
  <text class="body" x="82" y="204">「前方で通路側」</text>
  <path class="arrow" d="M266 184 H324"/>
  <rect class="box" x="330" y="124" width="230" height="120" rx="16"/>
  <text class="label" x="356" y="166">preference_parser</text>
  <text class="body" x="356" y="200">SeatPreference に変換</text>
  <path class="arrow" d="M560 184 H618"/>
  <rect class="web" x="624" y="124" width="230" height="120" rx="16"/>
  <text class="label" x="650" y="166">seat_finder</text>
  <text class="body" x="650" y="200">WebMCP 命令型 tool</text>
  <path class="arrow" d="M854 184 H912"/>
  <rect class="code" x="918" y="124" width="230" height="120" rx="16"/>
  <text class="label" x="944" y="166">Python ranking</text>
  <text class="body" x="944" y="200">score と retry を固定</text>
  <path class="arrow" d="M1033 244 V310"/>
  <rect class="box" x="918" y="316" width="230" height="120" rx="16"/>
  <text class="label" x="944" y="358">explanation</text>
  <text class="body" x="944" y="392">順位の説明だけ補助</text>
  <path class="arrow" d="M918 376 H854"/>
  <rect class="web" x="624" y="316" width="230" height="120" rx="16"/>
  <text class="label" x="650" y="358">reservation</text>
  <text class="body" x="650" y="392">WebMCP 宣言型 form</text>
  <path class="arrow" d="M624 376 H560"/>
  <rect class="box" x="330" y="316" width="230" height="120" rx="16"/>
  <text class="label" x="356" y="358">運営ボード</text>
  <text class="body" x="356" y="392">connpass ID を確認</text>
  <rect class="code" x="112" y="518" width="976" height="90" rx="18"/>
  <text class="label" x="146" y="556">ポイント</text>
  <text class="body" x="246" y="556">「どの順番で動くか」「何回 retry するか」「どの失敗だけ retry するか」は Python Workflow が決めます。</text>
  <text class="body" x="246" y="586">specialist agent は、tool 呼び出しや説明生成など狭い仕事だけを担当します。</text>
</svg>

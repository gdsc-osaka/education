<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ハンズオンの multi-agent 実行構成</title>
  <desc id="desc">予約サイト、WebMCP relay、ADK Web、coordinator Workflow、preference parser、seat finder、seat ranker、reservation agent、運営 API と予約ボードの関係</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#202124"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4285F4"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#fff"/>
  <rect x="50" y="50" width="1100" height="575" rx="34" fill="#f1f3f4"/>
  <text x="90" y="112" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#202124">実行時の接続</text>

  <rect x="90" y="165" width="245" height="330" rx="22" fill="#fff"/>
  <text x="120" y="215" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#202124">予約サイト</text>
  <text x="120" y="250" font-family="Arial, sans-serif" font-size="17" fill="#5f6368">localhost:5173</text>
  <text x="120" y="300" font-family="Arial, sans-serif" font-size="17" fill="#5f6368">通常 UI</text>
  <text x="120" y="330" font-family="Arial, sans-serif" font-size="17" fill="#5f6368">API client</text>
  <text x="120" y="360" font-family="Arial, sans-serif" font-size="17" fill="#5f6368">WebMCP tool/action</text>
  <rect x="120" y="407" width="185" height="42" rx="8" fill="#E6F4EA"/>
  <text x="139" y="434" font-family="Arial, sans-serif" font-size="16" fill="#137333">BOARD_URL + /api</text>

  <rect x="395" y="165" width="245" height="330" rx="22" fill="#4285F4"/>
  <text x="425" y="215" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#fff">WebMCP relay</text>
  <text x="425" y="250" font-family="Arial, sans-serif" font-size="17" fill="#E8F0FE">stdio / websocket</text>
  <text x="425" y="305" font-family="Arial, sans-serif" font-size="17" fill="#E8F0FE">tool discovery</text>
  <text x="425" y="335" font-family="Arial, sans-serif" font-size="17" fill="#E8F0FE">tool execution</text>
  <text x="425" y="395" font-family="Arial, sans-serif" font-size="17" fill="#E8F0FE">browser tab must be open</text>

  <rect x="700" y="90" width="370" height="505" rx="24" fill="#fff"/>
  <text x="730" y="137" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#202124">ADK Web / coordinator Workflow</text>
  <text x="730" y="170" font-family="Arial, sans-serif" font-size="17" fill="#5f6368">localhost:8000</text>
  <rect x="730" y="205" width="290" height="48" rx="12" fill="#E8F0FE"/>
  <text x="752" y="235" font-family="Arial, sans-serif" font-size="16" fill="#174EA6">preference_parser_agent</text>
  <rect x="730" y="275" width="290" height="48" rx="12" fill="#E6F4EA"/>
  <text x="752" y="305" font-family="Arial, sans-serif" font-size="16" fill="#137333">seat_finder_agent</text>
  <rect x="730" y="345" width="290" height="48" rx="12" fill="#FEF7E0"/>
  <text x="752" y="375" font-family="Arial, sans-serif" font-size="16" fill="#A14200">explanation_agent</text>
  <rect x="730" y="415" width="290" height="48" rx="12" fill="#FCE8E6"/>
  <text x="752" y="445" font-family="Arial, sans-serif" font-size="16" fill="#A50E0E">reservation_agent</text>
  <text x="730" y="518" font-family="Arial, sans-serif" font-size="16" fill="#5f6368">Workflow code controls order and retry</text>

  <path d="M345 330 H380" stroke="#202124" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M650 330 H685" stroke="#202124" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M875 253 V272" stroke="#4285F4" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path d="M875 323 V342" stroke="#4285F4" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path d="M875 393 V412" stroke="#4285F4" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path d="M215 505 C215 590 920 590 920 600" fill="none" stroke="#34A853" stroke-width="5" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
  <text x="370" y="626" font-family="Arial, sans-serif" font-size="20" fill="#202124">運営ボードで connpass ID を確認</text>
</svg>

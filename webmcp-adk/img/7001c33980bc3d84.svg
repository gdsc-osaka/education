<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ハンズオンの multi-agent 実行構成</title>
  <desc id="desc">予約サイト、WebMCP relay、ADK Web、coordinator、seat finder、reservation agent、運営 API と予約ボードの関係</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#202124"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4285F4"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#fff"/>
  <rect x="50" y="50" width="1100" height="575" rx="34" fill="#f1f3f4"/>
  <text x="90" y="112" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#202124">実行時の接続</text>

  <rect x="90" y="165" width="250" height="330" rx="22" fill="#fff"/>
  <text x="120" y="215" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#202124">予約サイト</text>
  <text x="120" y="250" font-family="Arial, sans-serif" font-size="17" fill="#5f6368">localhost:5173</text>
  <text x="120" y="300" font-family="Arial, sans-serif" font-size="17" fill="#5f6368">通常 UI</text>
  <text x="120" y="330" font-family="Arial, sans-serif" font-size="17" fill="#5f6368">API client</text>
  <text x="120" y="360" font-family="Arial, sans-serif" font-size="17" fill="#5f6368">WebMCP tool/action</text>
  <rect x="120" y="407" width="185" height="42" rx="8" fill="#E6F4EA"/>
  <text x="139" y="434" font-family="Arial, sans-serif" font-size="16" fill="#137333">BOARD_URL + /api</text>

  <rect x="410" y="165" width="250" height="330" rx="22" fill="#4285F4"/>
  <text x="440" y="215" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#fff">WebMCP relay</text>
  <text x="440" y="250" font-family="Arial, sans-serif" font-size="17" fill="#E8F0FE">stdio / websocket</text>
  <text x="440" y="305" font-family="Arial, sans-serif" font-size="17" fill="#E8F0FE">tool discovery</text>
  <text x="440" y="335" font-family="Arial, sans-serif" font-size="17" fill="#E8F0FE">tool execution</text>
  <text x="440" y="395" font-family="Arial, sans-serif" font-size="17" fill="#E8F0FE">browser tab must be open</text>

  <rect x="730" y="110" width="330" height="465" rx="24" fill="#fff"/>
  <text x="760" y="160" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#202124">ADK Web</text>
  <text x="760" y="195" font-family="Arial, sans-serif" font-size="17" fill="#5f6368">localhost:8000</text>
  <rect x="760" y="230" width="250" height="58" rx="12" fill="#E8F0FE"/>
  <text x="785" y="266" font-family="Arial, sans-serif" font-size="17" fill="#174EA6">coordinator</text>
  <rect x="760" y="318" width="250" height="58" rx="12" fill="#E6F4EA"/>
  <text x="785" y="354" font-family="Arial, sans-serif" font-size="17" fill="#137333">seat_finder_agent</text>
  <rect x="760" y="406" width="250" height="58" rx="12" fill="#FCE8E6"/>
  <text x="785" y="442" font-family="Arial, sans-serif" font-size="17" fill="#A50E0E">reservation_agent</text>
  <text x="760" y="512" font-family="Arial, sans-serif" font-size="16" fill="#5f6368">AgentTool でローカル multi-agent</text>

  <path d="M350 330 H395" stroke="#202124" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M670 330 H715" stroke="#202124" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M887 289 V315" stroke="#4285F4" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path d="M887 377 V403" stroke="#4285F4" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path d="M215 505 C215 590 920 590 920 580" fill="none" stroke="#34A853" stroke-width="5" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
  <text x="370" y="606" font-family="Arial, sans-serif" font-size="20" fill="#202124">運営ボードで connpass ID を確認</text>
</svg>

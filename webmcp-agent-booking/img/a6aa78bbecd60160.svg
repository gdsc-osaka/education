  <rect width="1280" height="720" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="22" fill="#202124" text-anchor="middle">
    <rect x="55" y="290" width="160" height="95" rx="8" fill="#e8f0fe" stroke="#3c4043" stroke-width="2"/><text x="135" y="345">希望解析</text>
    <rect x="265" y="290" width="160" height="95" rx="8" fill="#e8f0fe" stroke="#3c4043" stroke-width="2"/><text x="345" y="345">空席取得</text>
    <rect x="475" y="290" width="180" height="95" rx="8" fill="#e8f0fe" stroke="#3c4043" stroke-width="2"/><text x="565" y="330">3軸並列</text><text x="565" y="360">評価</text>
    <rect x="705" y="290" width="160" height="95" rx="8" fill="#e6f4ea" stroke="#3c4043" stroke-width="2"/><text x="785" y="345">ランキング</text>
    <rect x="915" y="290" width="160" height="95" rx="8" fill="#fef7e0" stroke="#3c4043" stroke-width="2"/><text x="995" y="330">予約</text><text x="995" y="360">リトライ</text>
    <rect x="1125" y="290" width="110" height="95" rx="8" fill="#e8f0fe" stroke="#3c4043" stroke-width="2"/><text x="1180" y="330">説明文</text><text x="1180" y="360">生成</text>
  </g>
  <g stroke="#3c4043" stroke-width="4" marker-end="url(#arrow)">
    <path d="M215 337h50"/><path d="M425 337h50"/><path d="M655 337h50"/><path d="M865 337h50"/><path d="M1075 337h50"/>
  </g>

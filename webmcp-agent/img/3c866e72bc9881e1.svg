<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Declarative WebMCP form diagram</title>
  <desc id="desc">A hidden reservation form gets declarative WebMCP metadata so an agent can discover it as a reserve_seat tool.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3c4043"/>
    </marker>
    <style>
      .bg{fill:#f8fafd}
      .panel{fill:#fff;stroke:#dadce0;stroke-width:2}
      .form{fill:#e8f0fe;stroke:#4285f4;stroke-width:2}
      .meta{fill:#e6f4ea;stroke:#34a853;stroke-width:2}
      .tool{fill:#fef7e0;stroke:#fbbc04;stroke-width:2}
      .ink{fill:#202124;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .muted{fill:#5f6368;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .title{font-size:34px;font-weight:700}
      .label{font-size:25px;font-weight:700}
      .sub{font-size:18px}
      .code{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px;fill:#202124}
      .arrow{stroke:#3c4043;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="44"/>
  <text class="ink title" x="72" y="82">予約フォームに宣言型 WebMCP を実装する</text>

  <rect class="panel" x="78" y="148" width="330" height="430" rx="28"/>
  <text class="ink label" x="122" y="208">既存の予約フォーム</text>
  <rect class="form" x="122" y="260" width="242" height="62" rx="16"/>
  <text class="code" x="148" y="299">&lt;form method="post"&gt;</text>
  <rect class="form" x="122" y="350" width="242" height="62" rx="16"/>
  <text class="code" x="151" y="389">participantId</text>
  <rect class="form" x="122" y="440" width="242" height="62" rx="16"/>
  <text class="code" x="181" y="479">seatId</text>
  <text class="muted sub" x="122" y="544">画面には見えない hidden form</text>

  <path class="arrow" d="M418 362H504"/>

  <rect class="panel" x="520" y="128" width="332" height="470" rx="28"/>
  <text class="ink label" x="576" y="188">metadata を追加</text>
  <rect class="meta" x="568" y="246" width="236" height="58" rx="16"/>
  <text class="code" x="596" y="282">toolname</text>
  <rect class="meta" x="568" y="326" width="236" height="58" rx="16"/>
  <text class="code" x="584" y="362">tooldescription</text>
  <rect class="meta" x="568" y="406" width="236" height="58" rx="16"/>
  <text class="code" x="571" y="442">toolparamdescription</text>
  <text class="muted sub" x="568" y="522">フォームを tool として説明する</text>

  <path class="arrow" d="M862 362H948"/>

  <rect class="panel" x="964" y="148" width="238" height="430" rx="28"/>
  <text class="ink label" x="1015" y="208">Agent</text>
  <rect class="tool" x="1000" y="275" width="166" height="76" rx="18"/>
  <text class="code" x="1020" y="321">reserve_seat</text>
  <text class="muted sub" x="1004" y="400">参加者IDと席番号で</text>
  <text class="muted sub" x="1004" y="430">予約できると分かる</text>

  <rect class="tool" x="318" y="628" width="644" height="52" rx="26"/>
  <text class="ink sub" x="369" y="662">JavaScript を書かずに、フォームの意味を構造化して伝える</text>
</svg>

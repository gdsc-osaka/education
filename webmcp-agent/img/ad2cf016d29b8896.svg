<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Wrap up WebMCP Agent codelab</title>
  <desc id="desc">A summary diagram showing declarative WebMCP, imperative WebMCP, Antigravity bridge, and the live seat booking experience.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3c4043"/>
    </marker>
    <style>
      .bg{fill:#f8fafd}
      .panel{fill:#fff;stroke:#dadce0;stroke-width:2}
      .declarative{fill:#e8f0fe;stroke:#4285f4;stroke-width:2}
      .imperative{fill:#e6f4ea;stroke:#34a853;stroke-width:2}
      .agent{fill:#f3e8fd;stroke:#a142f4;stroke-width:2}
      .live{fill:#fef7e0;stroke:#fbbc04;stroke-width:2}
      .next{fill:#fce8e6;stroke:#ea4335;stroke-width:2}
      .ink{fill:#202124;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .muted{fill:#5f6368;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .title{font-size:34px;font-weight:700}
      .label{font-size:23px;font-weight:700}
      .sub{font-size:18px}
      .small{font-size:15px}
      .mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:16px;fill:#202124}
      .arrow{stroke:#3c4043;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#dadce0;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="44"/>
  <text class="ink title" x="72" y="82">まとめと次のステップ</text>
  <text class="muted sub" x="74" y="116">Web ページの機能を、Agent が呼び出せる tool として見せる</text>

  <rect class="panel" x="70" y="156" width="266" height="372" rx="28"/>
  <text class="ink label" x="122" y="210">宣言型 WebMCP</text>
  <rect class="declarative" x="104" y="252" width="198" height="64" rx="18"/>
  <text class="mono" x="128" y="290">reserve_seat</text>
  <text class="muted small" x="104" y="364">HTML form に metadata を追加</text>
  <text class="muted small" x="104" y="392">参加者 ID と席 ID を入力</text>
  <text class="muted small" x="104" y="420">toolautosubmit で送信</text>

  <path class="arrow" d="M350 342H428"/>

  <rect class="panel" x="442" y="128" width="360" height="430" rx="28"/>
  <text class="ink label" x="536" y="182">命令型 WebMCP</text>
  <rect class="imperative" x="486" y="222" width="272" height="52" rx="16"/>
  <text class="mono" x="590" y="254">ping</text>
  <rect class="imperative" x="486" y="290" width="272" height="52" rx="16"/>
  <text class="mono" x="564" y="322">seat_summary</text>
  <rect class="imperative" x="486" y="358" width="272" height="52" rx="16"/>
  <text class="mono" x="580" y="390">seat_list</text>
  <rect class="imperative" x="486" y="426" width="272" height="52" rx="16"/>
  <text class="mono" x="548" y="458">my_reservation</text>
  <text class="muted small" x="488" y="514">registerTool() で既存関数を tool 化</text>

  <path class="arrow" d="M814 342H890"/>

  <rect class="panel" x="904" y="156" width="306" height="372" rx="28"/>
  <text class="ink label" x="986" y="210">Agent から実行</text>
  <rect class="agent" x="944" y="250" width="226" height="64" rx="18"/>
  <text class="mono" x="982" y="288">Antigravity CLI</text>
  <rect class="agent" x="944" y="340" width="226" height="64" rx="18"/>
  <text class="mono" x="982" y="378">bridge / extension</text>
  <rect class="live" x="944" y="430" width="226" height="54" rx="18"/>
  <text class="ink label" x="990" y="465">同時予約体験</text>

  <rect class="next" x="180" y="604" width="920" height="62" rx="26"/>
  <text class="ink label" x="286" y="641">次は description・schema・返す JSON を変えて、Agent の動きを観察する</text>
</svg>

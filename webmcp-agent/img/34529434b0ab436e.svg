<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Cancel reservation WebMCP tool diagram</title>
  <desc id="desc">The cancel_reservation tool receives a participant ID, calls cancelReservation, updates the page, and changes reservation state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3c4043"/>
    </marker>
    <style>
      .bg{fill:#f8fafd}
      .panel{fill:#fff;stroke:#dadce0;stroke-width:2}
      .agent{fill:#e8f0fe;stroke:#4285f4;stroke-width:2}
      .tool{fill:#fef7e0;stroke:#fbbc04;stroke-width:2}
      .page{fill:#e6f4ea;stroke:#34a853;stroke-width:2}
      .api{fill:#fce8e6;stroke:#ea4335;stroke-width:2}
      .warn{fill:#fce8e6;stroke:#ea4335;stroke-width:2}
      .result{fill:#f3e8fd;stroke:#a142f4;stroke-width:2}
      .ink{fill:#202124;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .muted{fill:#5f6368;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .title{font-size:34px;font-weight:700}
      .label{font-size:24px;font-weight:700}
      .sub{font-size:18px}
      .mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px;fill:#202124}
      .smallmono{font-family:'SFMono-Regular',Consolas,monospace;font-size:16px;fill:#202124}
      .arrow{stroke:#3c4043;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#dadce0;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="44"/>
  <text class="ink title" x="72" y="82">命令型 WebMCP で予約を解除する</text>
  <text class="muted sub" x="74" y="116">cancel_reservation は予約状態を変更する tool。readOnlyHint は true にしない</text>

  <rect class="panel" x="60" y="166" width="214" height="236" rx="26"/>
  <rect class="agent" x="94" y="214" width="146" height="64" rx="18"/>
  <text class="ink label" x="130" y="254">Agent</text>
  <text class="smallmono" x="92" y="324">participantId</text>
  <text class="muted sub" x="94" y="352">予約を解除したい</text>

  <path class="arrow" d="M286 284H384"/>

  <rect class="panel" x="396" y="136" width="288" height="296" rx="26"/>
  <text class="ink label" x="456" y="194">WebMCP tool</text>
  <rect class="tool" x="436" y="236" width="208" height="64" rx="18"/>
  <text class="mono" x="452" y="276">cancel_reservation</text>
  <text class="muted sub" x="446" y="342">readOnlyHint: false</text>
  <text class="muted sub" x="446" y="370">予約データを変更する</text>

  <path class="arrow" d="M696 284H786"/>

  <rect class="panel" x="798" y="132" width="270" height="306" rx="26"/>
  <text class="ink label" x="862" y="190">Web ページ</text>
  <rect class="page" x="838" y="232" width="190" height="58" rx="16"/>
  <text class="mono" x="862" y="268">#participant-id</text>
  <rect class="page" x="838" y="314" width="190" height="58" rx="16"/>
  <text class="mono" x="858" y="350">cancelReservation()</text>
  <text class="muted sub" x="838" y="408">render() で画面更新</text>

  <path class="arrow" d="M1080 284H1140"/>

  <rect class="panel" x="1152" y="166" width="86" height="236" rx="26"/>
  <rect class="api" x="1170" y="232" width="50" height="58" rx="16"/>
  <text class="ink label" x="1175" y="268">API</text>
  <text class="muted sub" x="1166" y="334">DELETE</text>
  <text class="muted sub" x="1164" y="360">予約</text>

  <path class="arrow" d="M1126 450C932 586 662 596 426 506"/>

  <rect class="result" x="146" y="488" width="404" height="132" rx="26"/>
  <text class="ink label" x="194" y="538">解除後の状態</text>
  <line class="thin" x1="194" y1="556" x2="510" y2="556"/>
  <text class="smallmono" x="194" y="590">my_reservation =&gt; { reservation: null }</text>

  <rect class="warn" x="672" y="532" width="426" height="76" rx="24"/>
  <text class="ink label" x="724" y="580">状態変更 tool として慎重に扱う</text>
</svg>

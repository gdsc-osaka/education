<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Live booking with multiple agents</title>
  <desc id="desc">Multiple participants ask their agents to reserve seats through WebMCP tools against a shared API, causing first-come-first-served conflicts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3c4043"/>
    </marker>
    <style>
      .bg{fill:#f8fafd}
      .panel{fill:#fff;stroke:#dadce0;stroke-width:2}
      .participant{fill:#e8f0fe;stroke:#4285f4;stroke-width:2}
      .agent{fill:#f3e8fd;stroke:#a142f4;stroke-width:2}
      .tool{fill:#fef7e0;stroke:#fbbc04;stroke-width:2}
      .api{fill:#e6f4ea;stroke:#34a853;stroke-width:2}
      .conflict{fill:#fce8e6;stroke:#ea4335;stroke-width:2}
      .seatFree{fill:#e6f4ea;stroke:#34a853;stroke-width:2}
      .seatTaken{fill:#fce8e6;stroke:#ea4335;stroke-width:2}
      .seatMine{fill:#e8f0fe;stroke:#4285f4;stroke-width:2}
      .ink{fill:#202124;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .muted{fill:#5f6368;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .title{font-size:34px;font-weight:700}
      .label{font-size:23px;font-weight:700}
      .sub{font-size:18px}
      .small{font-size:15px}
      .mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:17px;fill:#202124}
      .arrow{stroke:#3c4043;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#ea4335;stroke-width:3;fill:none;stroke-dasharray:8 8}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="44"/>
  <text class="ink title" x="72" y="82">みんなで同時に席を予約する</text>
  <text class="muted sub" x="74" y="116">共通 API に向けて Agent が同時に予約し、早い者勝ちと競合を体験する</text>

  <rect class="panel" x="64" y="158" width="300" height="406" rx="28"/>
  <text class="ink label" x="124" y="212">参加者と希望</text>
  <g transform="translate(96 250)">
    <rect class="participant" x="0" y="0" width="236" height="72" rx="18"/>
    <text class="ink label" x="24" y="32">参加者 A</text>
    <text class="muted small" x="24" y="56">前の方を予約したい</text>
  </g>
  <g transform="translate(96 346)">
    <rect class="participant" x="0" y="0" width="236" height="72" rx="18"/>
    <text class="ink label" x="24" y="32">参加者 B</text>
    <text class="muted small" x="24" y="56">B列に近い席がよい</text>
  </g>
  <g transform="translate(96 442)">
    <rect class="participant" x="0" y="0" width="236" height="72" rx="18"/>
    <text class="ink label" x="24" y="32">参加者 C</text>
    <text class="muted small" x="24" y="56">空いている席を予約</text>
  </g>

  <path class="arrow" d="M376 362H452"/>

  <rect class="panel" x="466" y="142" width="334" height="438" rx="28"/>
  <text class="ink label" x="548" y="196">Antigravity Agent</text>
  <rect class="agent" x="516" y="236" width="234" height="60" rx="18"/>
  <text class="mono" x="556" y="273">希望を解釈</text>
  <rect class="tool" x="516" y="322" width="234" height="60" rx="18"/>
  <text class="mono" x="552" y="359">seat_list</text>
  <rect class="tool" x="516" y="408" width="234" height="60" rx="18"/>
  <text class="mono" x="542" y="445">reserve_seat</text>
  <text class="muted small" x="518" y="515">失敗したら最新の空席を取り直して</text>
  <text class="muted small" x="518" y="540">別の席を予約する</text>

  <path class="arrow" d="M812 362H888"/>

  <rect class="panel" x="900" y="124" width="316" height="500" rx="28"/>
  <text class="ink label" x="996" y="178">共通 API</text>
  <rect class="api" x="962" y="210" width="192" height="58" rx="18"/>
  <text class="mono" x="1000" y="246">座席状態</text>

  <g transform="translate(954 308)">
    <rect class="seatMine" x="0" y="0" width="48" height="42" rx="10"/>
    <text class="mono small" x="9" y="27">A1</text>
    <rect class="seatTaken" x="64" y="0" width="48" height="42" rx="10"/>
    <text class="mono small" x="73" y="27">A2</text>
    <rect class="seatTaken" x="128" y="0" width="48" height="42" rx="10"/>
    <text class="mono small" x="137" y="27">A3</text>
    <rect class="seatFree" x="0" y="58" width="48" height="42" rx="10"/>
    <text class="mono small" x="9" y="85">B1</text>
    <rect class="seatTaken" x="64" y="58" width="48" height="42" rx="10"/>
    <text class="mono small" x="73" y="85">B2</text>
    <rect class="seatFree" x="128" y="58" width="48" height="42" rx="10"/>
    <text class="mono small" x="137" y="85">B3</text>
    <rect class="seatFree" x="0" y="116" width="48" height="42" rx="10"/>
    <text class="mono small" x="9" y="143">C1</text>
    <rect class="seatFree" x="64" y="116" width="48" height="42" rx="10"/>
    <text class="mono small" x="73" y="143">C2</text>
    <rect class="seatTaken" x="128" y="116" width="48" height="42" rx="10"/>
    <text class="mono small" x="137" y="143">C3</text>
  </g>

  <rect class="conflict" x="940" y="512" width="236" height="62" rx="18"/>
  <text class="ink label" x="977" y="548">競合したら再挑戦</text>

  <path class="dash" d="M1074 512C1020 462 1046 428 1092 404"/>

  <rect class="tool" x="198" y="620" width="884" height="56" rx="24"/>
  <text class="ink label" x="295" y="656">講師の合図後、ページを再読み込みしてから一斉に Agent へ依頼する</text>
</svg>

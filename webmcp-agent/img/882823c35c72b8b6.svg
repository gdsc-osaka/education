<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Imperative WebMCP file diagram</title>
  <desc id="desc">The new webmcp.js file calls document.modelContext.registerTool to expose a ping tool to the agent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3c4043"/>
    </marker>
    <style>
      .bg{fill:#f8fafd}
      .panel{fill:#fff;stroke:#dadce0;stroke-width:2}
      .file{fill:#e8f0fe;stroke:#4285f4;stroke-width:2}
      .api{fill:#e6f4ea;stroke:#34a853;stroke-width:2}
      .tool{fill:#fef7e0;stroke:#fbbc04;stroke-width:2}
      .ink{fill:#202124;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .muted{fill:#5f6368;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .title{font-size:34px;font-weight:700}
      .label{font-size:25px;font-weight:700}
      .sub{font-size:18px}
      .code{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px;fill:#202124}
      .arrow{stroke:#3c4043;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="44"/>
  <text class="ink title" x="72" y="82">命令型 WebMCP を実装する webmcp.js を作成する</text>

  <rect class="panel" x="78" y="152" width="282" height="410" rx="28"/>
  <text class="ink label" x="126" y="212">新規ファイル</text>
  <rect class="file" x="124" y="270" width="190" height="78" rx="18"/>
  <text class="code" x="158" y="318">webmcp.js</text>
  <text class="muted sub" x="116" y="404">HTML から app.js の後に読む</text>
  <text class="muted sub" x="116" y="432">既存関数を後続ページで使う</text>

  <path class="arrow" d="M370 356H485"/>

  <rect class="panel" x="500" y="132" width="316" height="450" rx="28"/>
  <text class="ink label" x="566" y="192">命令型 API</text>
  <rect class="api" x="548" y="252" width="220" height="70" rx="18"/>
  <text class="code" x="570" y="294">modelContext</text>
  <rect class="api" x="548" y="360" width="220" height="70" rx="18"/>
  <text class="code" x="566" y="402">registerTool()</text>
  <text class="muted sub" x="548" y="500">JavaScript で tool を登録</text>

  <path class="arrow" d="M826 356H940"/>

  <rect class="panel" x="956" y="152" width="246" height="410" rx="28"/>
  <text class="ink label" x="1020" y="212">Agent</text>
  <rect class="tool" x="1000" y="292" width="160" height="74" rx="18"/>
  <text class="code" x="1040" y="337">ping</text>
  <text class="muted sub" x="992" y="430">まずは固定レスポンスで</text>
  <text class="muted sub" x="992" y="458">接続確認をする</text>

  <rect class="tool" x="310" y="626" width="660" height="52" rx="26"/>
  <text class="ink sub" x="382" y="660">ping が見えれば、命令型 WebMCP の登録経路は成功</text>
</svg>

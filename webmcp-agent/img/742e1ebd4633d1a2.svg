<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Test WebMCP tools with Antigravity diagram</title>
  <desc id="desc">A checklist showing Antigravity calling WebMCP tools: ping, read tools, reserve_seat, and cancel_reservation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3c4043"/>
    </marker>
    <style>
      .bg{fill:#f8fafd}
      .panel{fill:#fff;stroke:#dadce0;stroke-width:2}
      .agent{fill:#e8f0fe;stroke:#4285f4;stroke-width:2}
      .browser{fill:#e6f4ea;stroke:#34a853;stroke-width:2}
      .tool{fill:#fef7e0;stroke:#fbbc04;stroke-width:2}
      .write{fill:#fce8e6;stroke:#ea4335;stroke-width:2}
      .ok{fill:#f3e8fd;stroke:#a142f4;stroke-width:2}
      .ink{fill:#202124;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .muted{fill:#5f6368;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .title{font-size:34px;font-weight:700}
      .label{font-size:24px;font-weight:700}
      .sub{font-size:18px}
      .mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:17px;fill:#202124}
      .small{font-size:16px}
      .arrow{stroke:#3c4043;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#dadce0;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="44"/>
  <text class="ink title" x="72" y="82">Antigravity で WebMCP tool をテストする</text>
  <text class="muted sub" x="74" y="116">大きな依頼の前に、tool ごとに小さく確認する</text>

  <rect class="panel" x="70" y="164" width="254" height="380" rx="28"/>
  <text class="ink label" x="118" y="222">Antigravity CLI</text>
  <rect class="agent" x="108" y="268" width="178" height="70" rx="18"/>
  <text class="mono" x="146" y="310">agy</text>
  <text class="muted sub" x="110" y="390">プロンプトで</text>
  <text class="muted sub" x="110" y="418">tool を呼び出す</text>

  <path class="arrow" d="M336 354H438"/>

  <rect class="panel" x="450" y="140" width="334" height="430" rx="28"/>
  <text class="ink label" x="522" y="198">Chrome / Extension</text>
  <rect class="browser" x="500" y="248" width="234" height="64" rx="18"/>
  <text class="mono" x="532" y="286">WebMCP bridge</text>
  <rect class="browser" x="500" y="340" width="234" height="64" rx="18"/>
  <text class="mono" x="544" y="378">席予約サイト</text>
  <text class="muted sub" x="500" y="468">ページを再読み込みして</text>
  <text class="muted sub" x="500" y="496">tool 登録を反映</text>

  <path class="arrow" d="M796 354H884"/>

  <rect class="panel" x="896" y="128" width="312" height="472" rx="28"/>
  <text class="ink label" x="988" y="184">チェック順</text>
  <rect class="tool" x="940" y="226" width="224" height="52" rx="16"/>
  <text class="mono" x="1014" y="259">ping</text>
  <rect class="tool" x="940" y="296" width="224" height="52" rx="16"/>
  <text class="mono" x="964" y="329">seat_summary</text>
  <rect class="tool" x="940" y="366" width="224" height="52" rx="16"/>
  <text class="mono" x="984" y="399">seat_list</text>
  <rect class="tool" x="940" y="436" width="224" height="52" rx="16"/>
  <text class="mono" x="968" y="469">my_reservation</text>
  <rect class="write" x="940" y="506" width="224" height="52" rx="16"/>
  <text class="mono" x="950" y="539">reserve / cancel</text>

  <rect class="ok" x="260" y="618" width="760" height="58" rx="26"/>
  <text class="ink label" x="342" y="654">個別に確認できたら、最後に Agent へ予約を依頼する</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">My reservation WebMCP tool diagram</title>
  <desc id="desc">The my_reservation tool receives a participant ID, updates the page input, calls getMyReservation, and returns the current reservation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3c4043"/>
    </marker>
    <style>
      .bg{fill:#f8fafd}
      .panel{fill:#fff;stroke:#dadce0;stroke-width:2}
      .agent{fill:#e8f0fe;stroke:#4285f4;stroke-width:2}
      .tool{fill:#fef7e0;stroke:#fbbc04;stroke-width:2}
      .page{fill:#e6f4ea;stroke:#34a853;stroke-width:2}
      .api{fill:#fce8e6;stroke:#ea4335;stroke-width:2}
      .result{fill:#f3e8fd;stroke:#a142f4;stroke-width:2}
      .ink{fill:#202124;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .muted{fill:#5f6368;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .title{font-size:34px;font-weight:700}
      .label{font-size:24px;font-weight:700}
      .sub{font-size:18px}
      .mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px;fill:#202124}
      .smallmono{font-family:'SFMono-Regular',Consolas,monospace;font-size:16px;fill:#202124}
      .arrow{stroke:#3c4043;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#dadce0;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="44"/>
  <text class="ink title" x="72" y="82">命令型 WebMCP で自分の予約を確認する</text>
  <text class="muted sub" x="74" y="116">my_reservation は参加者 ID から現在の予約状況を読む tool</text>

  <rect class="panel" x="62" y="168" width="218" height="238" rx="26"/>
  <rect class="agent" x="96" y="216" width="150" height="64" rx="18"/>
  <text class="ink label" x="132" y="256">Agent</text>
  <text class="smallmono" x="94" y="326">participantId</text>
  <text class="muted sub" x="96" y="354">予約状況を知りたい</text>

  <path class="arrow" d="M292 286H390"/>

  <rect class="panel" x="402" y="142" width="270" height="292" rx="26"/>
  <text class="ink label" x="462" y="200">WebMCP tool</text>
  <rect class="tool" x="442" y="244" width="190" height="64" rx="18"/>
  <text class="mono" x="464" y="284">my_reservation</text>
  <text class="muted sub" x="452" y="354">readOnlyHint: true</text>
  <text class="muted sub" x="452" y="382">予約データは変更しない</text>

  <path class="arrow" d="M684 286H774"/>

  <rect class="panel" x="786" y="132" width="260" height="312" rx="26"/>
  <text class="ink label" x="840" y="190">Web ページ</text>
  <rect class="page" x="826" y="232" width="180" height="58" rx="16"/>
  <text class="mono" x="850" y="268">#participant-id</text>
  <rect class="page" x="826" y="316" width="180" height="58" rx="16"/>
  <text class="mono" x="846" y="352">getMyReservation()</text>
  <text class="muted sub" x="826" y="408">表示も更新する</text>

  <path class="arrow" d="M1058 286H1136"/>

  <rect class="panel" x="1148" y="168" width="88" height="238" rx="26"/>
  <rect class="api" x="1168" y="232" width="50" height="58" rx="16"/>
  <text class="ink label" x="1173" y="268">API</text>
  <text class="muted sub" x="1162" y="338">予約</text>
  <text class="muted sub" x="1162" y="364">確認</text>

  <path class="arrow" d="M1126 446C934 574 650 590 410 500"/>

  <rect class="result" x="156" y="486" width="392" height="132" rx="26"/>
  <text class="ink label" x="204" y="536">Agent に返す値</text>
  <line class="thin" x1="204" y1="554" x2="506" y2="554"/>
  <text class="smallmono" x="204" y="588">{ reservation: { seatId: "A-1" } }</text>
  <text class="smallmono" x="204" y="614">{ reservation: null }</text>

  <rect class="tool" x="664" y="532" width="420" height="72" rx="24"/>
  <text class="ink label" x="720" y="578">読むだけ。ただし画面表示は更新する</text>
</svg>

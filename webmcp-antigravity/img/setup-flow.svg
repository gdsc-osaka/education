<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Setup flow diagram</title>
  <desc id="desc">Setup order for VSCode, Node.js, Antigravity CLI agy, MCP bridge, Chrome WebMCP flag, extension, and template repository.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3c4043"/>
    </marker>
    <style>
      .bg{fill:#f8fafd}
      .card{fill:#fff;stroke:#dadce0;stroke-width:2}
      .blue{fill:#4285f4}
      .green{fill:#34a853}
      .yellow{fill:#fbbc04}
      .red{fill:#ea4335}
      .ink{fill:#202124;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .muted{fill:#5f6368;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .title{font-size:32px;font-weight:700}
      .label{font-size:22px;font-weight:700}
      .sub{font-size:16px}
      .num{fill:#fff;font-family:Arial,sans-serif;font-size:20px;font-weight:700}
      .arrow{stroke:#3c4043;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="44"/>
  <text class="ink title" x="72" y="80">セットアップは順番に進める</text>

  <g transform="translate(58 142)">
    <rect class="card" width="198" height="140" rx="22"/>
    <circle class="blue" cx="40" cy="40" r="23"/><text class="num" x="34" y="47">1</text>
    <text class="ink label" x="74" y="47">VSCode</text>
    <text class="muted sub" x="28" y="92">編集環境を用意</text>
  </g>
  <path class="arrow" d="M262 212H315"/>

  <g transform="translate(326 142)">
    <rect class="card" width="198" height="140" rx="22"/>
    <circle class="blue" cx="40" cy="40" r="23"/><text class="num" x="34" y="47">2</text>
    <text class="ink label" x="74" y="47">Node.js</text>
    <text class="muted sub" x="28" y="92">npm / npx</text>
  </g>
  <path class="arrow" d="M530 212H583"/>

  <g transform="translate(594 142)">
    <rect class="card" width="198" height="140" rx="22"/>
    <circle class="green" cx="40" cy="40" r="23"/><text class="num" x="34" y="47">3</text>
    <text class="ink label" x="74" y="47">agy</text>
    <text class="muted sub" x="28" y="92">Antigravity CLI</text>
  </g>
  <path class="arrow" d="M798 212H851"/>

  <g transform="translate(862 142)">
    <rect class="card" width="198" height="140" rx="22"/>
    <circle class="green" cx="40" cy="40" r="23"/><text class="num" x="34" y="47">4</text>
    <text class="ink label" x="74" y="47">MCP bridge</text>
    <text class="muted sub" x="28" y="92">mcp_config.json</text>
  </g>
  <path class="arrow" d="M1066 212H1119"/>

  <g transform="translate(1130 142)">
    <rect class="card" width="120" height="140" rx="22"/>
    <circle class="yellow" cx="40" cy="40" r="23"/><text class="num" x="34" y="47">5</text>
    <text class="ink label" x="23" y="92">Chrome</text>
    <text class="muted sub" x="23" y="117">flag</text>
  </g>

  <path class="arrow" d="M1190 288V370H1058"/>

  <g transform="translate(858 370)">
    <rect class="card" width="200" height="140" rx="22"/>
    <circle class="red" cx="40" cy="40" r="23"/><text class="num" x="34" y="47">6</text>
    <text class="ink label" x="74" y="47">Extension</text>
    <text class="muted sub" x="28" y="92">agy を開いたまま</text>
  </g>
  <path class="arrow" d="M846 440H793"/>

  <g transform="translate(594 370)">
    <rect class="card" width="198" height="140" rx="22"/>
    <circle class="green" cx="40" cy="40" r="23"/><text class="num" x="34" y="47">7</text>
    <text class="ink label" x="74" y="47">Template</text>
    <text class="muted sub" x="28" y="92">Git clone / zip</text>
  </g>
  <path class="arrow" d="M582 440H529"/>

  <g transform="translate(326 370)">
    <rect class="card" width="198" height="140" rx="22"/>
    <circle class="blue" cx="40" cy="40" r="23"/><text class="num" x="34" y="47">8</text>
    <text class="ink label" x="74" y="47">serve</text>
    <text class="muted sub" x="28" y="92">npx serve :8000</text>
  </g>
  <path class="arrow" d="M314 440H261"/>

  <g transform="translate(58 370)">
    <rect class="card" width="198" height="140" rx="22"/>
    <circle class="blue" cx="40" cy="40" r="23"/><text class="num" x="34" y="47">9</text>
    <text class="ink label" x="74" y="47">Tool check</text>
    <text class="muted sub" x="28" y="92">Agent に確認</text>
  </g>

  <rect x="302" y="588" width="676" height="62" rx="31" fill="#fce8e6"/>
  <text class="ink label" x="354" y="628">重要: 拡張機能を入れるまで agy を閉じない</text>
  <text class="muted sub" x="446" y="678">Windows / macOS / Linux で進められます</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">WebMCP concept diagram</title>
  <desc id="desc">Antigravity Agent uses a bridge extension to discover WebMCP tools exposed by a web application.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3c4043"/>
    </marker>
    <style>
      .bg{fill:#f8fafd}
      .panel{fill:#fff;stroke:#dadce0;stroke-width:2}
      .soft{fill:#eef3fd}
      .blue{fill:#4285f4}
      .green{fill:#34a853}
      .yellow{fill:#fbbc04}
      .red{fill:#ea4335}
      .ink{fill:#202124;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .muted{fill:#5f6368;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .label{font-size:30px;font-weight:700}
      .sub{font-size:20px}
      .small{font-size:17px}
      .code{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px;fill:#202124}
      .arrow{stroke:#3c4043;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .dash{stroke-dasharray:10 10}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="44"/>
  <text class="ink label" x="70" y="78">WebMCP は Web ページを Agent の tool にする</text>

  <rect class="panel" x="72" y="150" width="270" height="380" rx="28"/>
  <circle class="blue" cx="207" cy="235" r="52"/>
  <path d="M178 235a29 29 0 1 0 58 0a29 29 0 1 0-58 0" fill="#fff" opacity=".95"/>
  <circle class="blue" cx="195" cy="228" r="6"/>
  <circle class="blue" cx="219" cy="228" r="6"/>
  <path d="M193 250q14 12 29 0" stroke="#4285f4" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text class="ink label" x="118" y="335">Antigravity</text>
  <text class="muted sub" x="125" y="367">CLI Agent</text>
  <rect class="soft" x="112" y="405" width="190" height="54" rx="16"/>
  <text class="code" x="136" y="438">tool call</text>

  <rect class="panel" x="500" y="130" width="300" height="420" rx="28"/>
  <rect class="soft" x="535" y="175" width="230" height="82" rx="18"/>
  <circle class="red" cx="566" cy="216" r="11"/>
  <circle class="yellow" cx="598" cy="216" r="11"/>
  <circle class="green" cx="630" cy="216" r="11"/>
  <text class="ink label" x="550" y="330">Browser</text>
  <text class="muted sub" x="550" y="363">Chrome + extension</text>
  <rect class="blue" x="550" y="405" width="200" height="62" rx="20"/>
  <text x="578" y="444" fill="#fff" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="700">WebMCP Bridge</text>

  <rect class="panel" x="930" y="100" width="280" height="490" rx="28"/>
  <text class="ink label" x="972" y="166">Seat App</text>
  <text class="muted sub" x="972" y="199">HTML / CSS / JS</text>
  <rect class="soft" x="970" y="240" width="200" height="70" rx="18"/>
  <text class="code" x="996" y="283">reserve_seat</text>
  <rect class="soft" x="970" y="330" width="200" height="70" rx="18"/>
  <text class="code" x="1000" y="373">seat_list</text>
  <rect class="soft" x="970" y="420" width="200" height="70" rx="18"/>
  <text class="code" x="980" y="463">seat_summary</text>

  <path class="arrow" d="M342 340 H490"/>
  <path class="arrow" d="M800 340 H918"/>
  <path class="arrow dash" d="M928 520 C790 625 480 625 348 520"/>
  <text class="muted small" x="390" y="318">MCP bridge</text>
  <text class="muted small" x="820" y="318">tool discovery</text>
  <text class="muted small" x="540" y="643">結果は Agent に戻る</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">WebMCP concept diagram</title>
  <desc id="desc">A web page registers WebMCP tools for a browser agent. This workshop connects Antigravity CLI through an MCP bridge and Chrome extension.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3c4043"/>
    </marker>
    <style>
      .bg{fill:#f8fafd}
      .panel{fill:#fff;stroke:#dadce0;stroke-width:2}
      .soft{fill:#eef3fd}
      .greenSoft{fill:#e6f4ea}
      .yellowSoft{fill:#fef7e0}
      .blue{fill:#4285f4}
      .green{fill:#34a853}
      .yellow{fill:#fbbc04}
      .red{fill:#ea4335}
      .ink{fill:#202124;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .muted{fill:#5f6368;font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif}
      .title{font-size:32px;font-weight:700}
      .label{font-size:26px;font-weight:700}
      .sub{font-size:18px}
      .small{font-size:16px}
      .code{font-family:'SFMono-Regular',Consolas,monospace;font-size:17px;fill:#202124}
      .arrow{stroke:#3c4043;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .dash{stroke-dasharray:9 9}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="44"/>
  <text class="ink title" x="72" y="78">WebMCP は Web ページの機能をブラウザ側 Agent に見せる</text>

  <rect class="panel" x="64" y="145" width="295" height="440" rx="28"/>
  <rect class="soft" x="98" y="190" width="228" height="82" rx="18"/>
  <circle class="red" cx="130" cy="231" r="11"/>
  <circle class="yellow" cx="162" cy="231" r="11"/>
  <circle class="green" cx="194" cy="231" r="11"/>
  <text class="ink label" x="104" y="330">Browser</text>
  <text class="muted sub" x="104" y="362">browser's agent</text>
  <rect class="greenSoft" x="104" y="402" width="220" height="58" rx="17"/>
  <text class="code" x="127" y="438">observation</text>
  <text class="muted small" x="103" y="505">本来の想定: ブラウザ側で</text>
  <text class="muted small" x="103" y="530">ページの tool を取得</text>

  <rect class="panel" x="492" y="126" width="300" height="476" rx="28"/>
  <text class="ink label" x="545" y="188">Seat Booking</text>
  <text class="muted sub" x="552" y="220">HTML / CSS / JavaScript</text>
  <rect class="soft" x="535" y="270" width="214" height="56" rx="16"/>
  <text class="code" x="557" y="305">reserve_seat</text>
  <rect class="soft" x="535" y="344" width="214" height="56" rx="16"/>
  <text class="code" x="576" y="379">seat_list</text>
  <rect class="soft" x="535" y="418" width="214" height="56" rx="16"/>
  <text class="code" x="559" y="453">seat_summary</text>
  <rect class="yellowSoft" x="535" y="500" width="214" height="58" rx="16"/>
  <text class="code" x="553" y="536">modelContext</text>

  <rect class="panel" x="932" y="146" width="284" height="438" rx="28"/>
  <circle class="blue" cx="1074" cy="235" r="50"/>
  <path d="M1048 235a26 26 0 1 0 52 0a26 26 0 1 0-52 0" fill="#fff" opacity=".95"/>
  <circle class="blue" cx="1063" cy="228" r="5"/>
  <circle class="blue" cx="1085" cy="228" r="5"/>
  <path d="M1062 250q12 10 25 0" stroke="#4285f4" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text class="ink label" x="995" y="328">Antigravity CLI</text>
  <text class="muted sub" x="1014" y="360">this workshop</text>
  <rect class="soft" x="980" y="404" width="190" height="58" rx="17"/>
  <text class="code" x="1006" y="440">MCP bridge</text>
  <text class="muted small" x="981" y="506">拡張機能 + bridge で</text>
  <text class="muted small" x="981" y="531">WebMCP tool を渡す</text>

  <path class="arrow" d="M492 356H372"/>
  <text class="muted small" x="382" y="332">tools</text>
  <path class="arrow dash" d="M792 356H920"/>
  <text class="muted small" x="806" y="332">extension</text>
  <path class="arrow dash" d="M932 480C820 655 470 655 330 540"/>
  <text class="muted small" x="515" y="650">tool call の結果が戻る</text>
</svg>
